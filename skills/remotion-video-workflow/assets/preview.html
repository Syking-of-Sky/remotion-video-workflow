<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#292c36;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}video{width:100%;display:block;background:#20232a;border-radius:12px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,a{font:inherit;border:1px solid #c6c9ce;background:white;color:inherit;border-radius:8px;padding:10px 16px;cursor:pointer;text-decoration:none}p{line-height:1.6;color:#626777}
</style>
<main>
  <h1>视频预览</h1>
  <video id="film" controls playsinline preload="metadata" src="final.mp4"></video>
  <nav><button id="toggle">播放 / 暂停</button><button id="restart">从头播放</button><a href="final.mp4" download>下载成片</a></nav>
  <nav id="chapters"></nav>
  <p id="status" role="status">正在读取视频信息</p>
</main>
<script>
// Replace with this project's chapter times; never infer them from another video.
const chapters = [{time:0,label:'开头'}];
const v=document.querySelector('#film'), status=document.querySelector('#status');
const play=()=>v.play().catch(e=>{status.textContent=e.message});
const seek=time=>{if(v.readyState<1){v.addEventListener('loadedmetadata',()=>seek(time),{once:true});return}v.currentTime=Math.max(0,Math.min(time,v.duration));play()};
document.querySelector('#toggle').onclick=()=>v.paused?play():v.pause();
document.querySelector('#restart').onclick=()=>seek(0);
v.addEventListener('loadedmetadata',()=>{status.textContent=`${v.videoWidth} × ${v.videoHeight} · ${v.duration.toFixed(2)} 秒`});
v.addEventListener('error',()=>{status.textContent=`媒体加载错误：${v.error?.message||v.error?.code}`});
for(const c of chapters){const b=document.createElement('button');b.textContent=c.label;b.onclick=()=>seek(c.time);document.querySelector('#chapters').append(b)}
</script>
</html>
